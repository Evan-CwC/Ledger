<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="theme-color" content="#0E1A15">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>帳簿 Ledger</title>
<link rel="manifest" id="manifest">
<style>
:root{
  --bg:#0E1A15; --card:#16241D; --card2:#1C2E24; --line:#26382E;
  --text:#EDE7D8; --muted:#8FA396; --gold:#C9A961; --gold-dim:#8a7443;
  --red:#E07856; --green:#7FB98B;
  --radius:14px;
}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%}
body{
  background:var(--bg); color:var(--text);
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang HK","PingFang TC","Noto Sans TC",sans-serif;
  font-size:16px; line-height:1.5;
  padding-bottom:calc(64px + env(safe-area-inset-bottom));
  overscroll-behavior-y:none;
}
.num{font-variant-numeric:tabular-nums; letter-spacing:.01em}
header.app{
  padding:calc(14px + env(safe-area-inset-top)) 18px 10px;
  display:flex; align-items:baseline; justify-content:space-between;
}
header.app h1{font-size:17px; font-weight:700; letter-spacing:.14em; color:var(--gold)}
header.app .sub{font-size:12px; color:var(--muted)}
.page{display:none; padding:0 16px 24px; max-width:560px; margin:0 auto}
.page.active{display:block; animation:fade .18s ease}
@keyframes fade{from{opacity:0; transform:translateY(4px)}to{opacity:1; transform:none}}
@media (prefers-reduced-motion:reduce){*{animation:none!important; transition:none!important}}

/* ===== 月份選擇 ===== */
.monthbar{display:flex; align-items:center; justify-content:space-between; margin:6px 0 14px}
.monthbar button{background:var(--card); border:1px solid var(--line); color:var(--text); width:36px; height:36px; border-radius:10px; font-size:16px}
.monthbar .label{font-weight:700; font-size:15px; letter-spacing:.05em}

/* ===== 卡片 ===== */
.card{background:var(--card); border:1px solid var(--line); border-radius:var(--radius); padding:16px; margin-bottom:12px}
.row3{display:grid; grid-template-columns:1fr 1fr 1fr; gap:8px; text-align:center}
.row3 .k{font-size:12px; color:var(--muted); margin-bottom:2px}
.row3 .v{font-size:16px; font-weight:700}
.v.in{color:var(--green)} .v.out{color:var(--red)} .v.bal{color:var(--gold)}

/* ===== 記帳頁 ===== */
.typetog{display:flex; background:var(--card); border:1px solid var(--line); border-radius:12px; overflow:hidden; margin:6px 0 14px}
.typetog button{flex:1; padding:11px; background:none; border:none; color:var(--muted); font-size:15px; font-weight:600}
.typetog button.on-out{background:var(--red); color:#1a0f0a}
.typetog button.on-in{background:var(--green); color:#0d1a10}
.amtwrap{text-align:center; padding:18px 0 8px}
.amtwrap .cur{font-size:16px; color:var(--muted); vertical-align:top}
#amt{
  background:none; border:none; outline:none; color:var(--text);
  font-size:44px; font-weight:700; width:75%; text-align:center;
  border-bottom:2px solid var(--gold-dim); padding-bottom:4px;
}
#amt:focus{border-bottom-color:var(--gold)}
.chips{display:flex; flex-wrap:wrap; gap:8px; margin:12px 0}
.chip{
  background:var(--card); border:1px solid var(--line); border-radius:999px;
  padding:8px 14px; font-size:14px; color:var(--text);
}
.chip.on{background:var(--gold); color:#1c1608; border-color:var(--gold); font-weight:700}
.fieldrow{display:flex; gap:8px; margin-bottom:10px}
input[type=date], input[type=text], input[type=number], select{
  width:100%; background:var(--card); border:1px solid var(--line); border-radius:10px;
  color:var(--text); padding:11px 12px; font-size:15px; outline:none;
}
input:focus, select:focus{border-color:var(--gold-dim)}
input[type=date]{color-scheme:dark}
.btn{
  width:100%; padding:14px; border:none; border-radius:12px;
  background:var(--gold); color:#1c1608; font-size:16px; font-weight:700; margin-top:6px;
}
.btn:active{transform:scale(.99)}
.btn.ghost{background:var(--card); color:var(--text); border:1px solid var(--line); font-weight:600}
.btn.danger{background:none; color:var(--red); border:1px solid var(--red)}

/* ===== 明細 ===== */
.searchrow{display:flex; gap:8px; margin-bottom:12px}
.daygroup{margin-bottom:14px}
.daygroup .dh{display:flex; justify-content:space-between; font-size:12.5px; color:var(--muted); padding:0 4px 6px}
.tx{
  display:flex; align-items:center; gap:12px; background:var(--card);
  border:1px solid var(--line); border-radius:12px; padding:11px 13px; margin-bottom:7px;
}
.tx .ico{font-size:20px; width:34px; height:34px; display:flex; align-items:center; justify-content:center; background:var(--card2); border-radius:10px; flex:none}
.tx .mid{flex:1; min-width:0}
.tx .cat{font-size:14.5px; font-weight:600}
.tx .note{font-size:12.5px; color:var(--muted); white-space:nowrap; overflow:hidden; text-overflow:ellipsis}
.tx .amt{font-weight:700; font-size:15.5px}
.tx .amt.in{color:var(--green)} .tx .amt.out{color:var(--red)}
.empty{text-align:center; color:var(--muted); padding:40px 0; font-size:14px}

/* ===== 統計 ===== */
.chartwrap{position:relative; display:flex; justify-content:center; padding:8px 0}
canvas{max-width:100%}
.donut-center{position:absolute; top:50%; left:50%; transform:translate(-50%,-50%); text-align:center; pointer-events:none}
.donut-center .k{font-size:12px; color:var(--muted)}
.donut-center .v{font-size:22px; font-weight:700; color:var(--gold)}
.legend{margin-top:6px}
.legend .li{display:flex; align-items:center; gap:10px; padding:8px 2px; border-bottom:1px dashed var(--line)}
.legend .li:last-child{border-bottom:none}
.legend .dot{width:10px; height:10px; border-radius:3px; flex:none}
.legend .name{flex:1; font-size:14px}
.legend .pct{font-size:12.5px; color:var(--muted); width:48px; text-align:right}
.legend .sum{font-weight:700; font-size:14px; width:96px; text-align:right}
.stattog{display:flex; gap:8px; margin-bottom:12px}
.stattog button{flex:1; padding:9px; border-radius:10px; border:1px solid var(--line); background:var(--card); color:var(--muted); font-size:14px}
.stattog button.on{border-color:var(--gold); color:var(--gold); font-weight:700}

/* ===== 預算 ===== */
.budgetitem{margin-bottom:14px}
.budgetitem .top{display:flex; justify-content:space-between; font-size:14px; margin-bottom:6px}
.bar{height:10px; background:var(--card2); border-radius:99px; overflow:hidden}
.bar i{display:block; height:100%; background:var(--green); border-radius:99px; transition:width .3s}
.bar i.warn{background:var(--gold)} .bar i.over{background:var(--red)}
.budgetitem .sub{font-size:12px; color:var(--muted); margin-top:4px; display:flex; justify-content:space-between}

/* ===== 設定 ===== */
.setrow{display:flex; align-items:center; justify-content:space-between; padding:13px 2px; border-bottom:1px solid var(--line); font-size:15px}
.setrow:last-child{border-bottom:none}
.setrow small{color:var(--muted); display:block; font-size:12px}
.catlist .chip{margin:0 6px 8px 0; display:inline-flex; align-items:center; gap:6px}
.catlist .chip b{color:var(--red); font-weight:400}
h3.sec{font-size:13px; color:var(--muted); letter-spacing:.1em; margin:18px 4px 8px; font-weight:600}

/* ===== 底部導航 ===== */
nav{
  position:fixed; bottom:0; left:0; right:0; z-index:50;
  background:rgba(14,26,21,.94); backdrop-filter:blur(12px);
  border-top:1px solid var(--line);
  display:flex; padding-bottom:env(safe-area-inset-bottom);
}
nav button{
  flex:1; background:none; border:none; color:var(--muted);
  padding:9px 0 7px; font-size:11px; display:flex; flex-direction:column; align-items:center; gap:2px;
}
nav button .i{font-size:19px; line-height:1}
nav button.on{color:var(--gold)}

/* ===== 收據相 ===== */
.photobtn{display:flex; align-items:center; gap:8px; justify-content:center}
.photoprev{position:relative; margin:10px auto; width:110px; display:none}
.photoprev img{width:110px; height:110px; object-fit:cover; border-radius:12px; border:1px solid var(--line)}
.photoprev .rm{position:absolute; top:-8px; right:-8px; width:26px; height:26px; border-radius:50%; border:none; background:var(--red); color:#fff; font-size:14px}
.ocrhint{text-align:center; font-size:12.5px; color:var(--gold); min-height:18px}
.imgviewer{position:fixed; inset:0; background:rgba(0,0,0,.92); z-index:300; display:none; align-items:center; justify-content:center}
.imgviewer.show{display:flex}
.imgviewer img{max-width:96vw; max-height:90vh; border-radius:8px}

/* ===== 批量匯入 ===== */
.batchrow{background:var(--card); border:1px solid var(--line); border-radius:12px; padding:10px 12px; margin-bottom:8px}
.batchrow .top{display:flex; justify-content:space-between; align-items:center; margin-bottom:6px}
.batchrow .top input[type=text]{flex:1; margin-right:8px}
.batchrow .amt2{width:90px; text-align:right}
.batchrow select{margin-top:6px}
.batchrow .skip{display:flex; align-items:center; gap:6px; font-size:12.5px; color:var(--muted); margin-top:6px}

/* ===== 彈窗 ===== */
.sheetmask{position:fixed; inset:0; background:rgba(0,0,0,.55); z-index:100; display:none}
.sheetmask.show{display:flex; align-items:flex-end}
.sheet{background:var(--bg); border-top:1px solid var(--line); border-radius:18px 18px 0 0; width:100%; max-width:560px; margin:0 auto; padding:18px 16px calc(18px + env(safe-area-inset-bottom))}
.sheet h2{font-size:16px; margin-bottom:12px}
.toast{
  position:fixed; left:50%; bottom:90px; transform:translateX(-50%);
  background:var(--gold); color:#1c1608; padding:9px 18px; border-radius:99px;
  font-size:14px; font-weight:600; z-index:200; opacity:0; transition:opacity .2s; pointer-events:none;
}
.toast.show{opacity:1}
</style>
</head>
<body>

<header class="app">
  <h1>帳 簿</h1>
  <span class="sub num" id="todayLabel"></span>
</header>

<!-- ============ 記帳 ============ -->
<div class="page active" id="pg-add">
  <div class="typetog">
    <button id="tg-out" class="on-out" onclick="setType('out')">支出</button>
    <button id="tg-in" onclick="setType('in')">收入</button>
  </div>
  <div class="amtwrap">
    <span class="cur">$</span><input id="amt" type="number" inputmode="decimal" placeholder="0" step="0.01" min="0">
  </div>
  <div class="chips" id="catChips"></div>
  <div class="fieldrow">
    <input type="date" id="txDate">
  </div>
  <div class="fieldrow">
    <input type="text" id="txNote" placeholder="備註 (可留空)" maxlength="60">
  </div>
  <button class="btn ghost photobtn" onclick="$('camInput').click()">📷 影收據 (自動讀金額)</button>
  <input type="file" id="camInput" accept="image/*" hidden onchange="pickPhoto(this)">
  <div class="photoprev" id="photoPrev"><img id="photoImg"><button class="rm" onclick="removePhoto()">✕</button></div>
  <div class="ocrhint" id="ocrHint"></div>
  <button class="btn" onclick="saveTx()">儲存</button>
</div>

<!-- ============ 明細 ============ -->
<div class="page" id="pg-list">
  <div class="monthbar">
    <button onclick="shiftMonth(-1)">‹</button>
    <span class="label num" id="mLabel1"></span>
    <button onclick="shiftMonth(1)">›</button>
  </div>
  <div class="card row3">
    <div><div class="k">收入</div><div class="v in num" id="sumIn">$0</div></div>
    <div><div class="k">支出</div><div class="v out num" id="sumOut">$0</div></div>
    <div><div class="k">結餘</div><div class="v bal num" id="sumBal">$0</div></div>
  </div>
  <div class="searchrow">
    <input type="text" id="q" placeholder="搜尋備註/分類…" oninput="renderList()">
    <select id="fType" onchange="renderList()" style="width:110px">
      <option value="">全部</option><option value="out">支出</option><option value="in">收入</option>
    </select>
  </div>
  <div id="txList"></div>
</div>

<!-- ============ 統計 ============ -->
<div class="page" id="pg-stats">
  <div class="monthbar">
    <button onclick="shiftMonth(-1)">‹</button>
    <span class="label num" id="mLabel2"></span>
    <button onclick="shiftMonth(1)">›</button>
  </div>
  <div class="stattog">
    <button id="st-out" class="on" onclick="setStatType('out')">支出分佈</button>
    <button id="st-in" onclick="setStatType('in')">收入分佈</button>
  </div>
  <div class="card">
    <div class="chartwrap">
      <canvas id="donut" width="240" height="240"></canvas>
      <div class="donut-center"><div class="k" id="dcK">本月支出</div><div class="v num" id="dcV">$0</div></div>
    </div>
    <div class="legend" id="legend"></div>
  </div>
  <h3 class="sec">近 6 個月趨勢</h3>
  <div class="card">
    <canvas id="trend" height="150"></canvas>
  </div>
</div>

<!-- ============ 預算 ============ -->
<div class="page" id="pg-budget">
  <div class="monthbar">
    <button onclick="shiftMonth(-1)">‹</button>
    <span class="label num" id="mLabel3"></span>
    <button onclick="shiftMonth(1)">›</button>
  </div>
  <div class="card" id="budgetTotal"></div>
  <div class="card" id="budgetCats"></div>
  <button class="btn ghost" onclick="openBudgetSheet()">設定預算</button>
</div>

<!-- ============ 更多 ============ -->
<div class="page" id="pg-more">
  <h3 class="sec">分類管理</h3>
  <div class="card">
    <div style="font-size:13px;color:var(--muted);margin-bottom:8px">支出分類 (㩒住可刪除)</div>
    <div class="catlist" id="catOutList"></div>
    <div style="font-size:13px;color:var(--muted);margin:12px 0 8px">收入分類</div>
    <div class="catlist" id="catInList"></div>
    <div class="fieldrow" style="margin-top:12px">
      <input type="text" id="newCatEmoji" placeholder="🍜" style="width:64px" maxlength="2">
      <input type="text" id="newCatName" placeholder="新分類名" maxlength="8">
      <select id="newCatType" style="width:96px"><option value="out">支出</option><option value="in">收入</option></select>
    </div>
    <button class="btn ghost" onclick="addCat()">新增分類</button>
  </div>

  <h3 class="sec">數據備份</h3>
  <div class="card">
    <div class="setrow" onclick="$('bankInput').click()">
      <div>批量匯入(銀行結單截圖)<small>上載交易紀錄截圖,自動識別多筆</small></div><span>›</span>
    </div>
    <input type="file" id="bankInput" accept="image/*" hidden onchange="pickBankStmt(this)">
    <div class="setrow" onclick="exportCSV()">
      <div>匯出 CSV<small>可直接 Import 入 Notion 資料庫</small></div><span>›</span>
    </div>
    <div class="setrow" onclick="document.getElementById('csvFile').click()">
      <div>匯入 CSV<small>還原之前匯出嘅檔案</small></div><span>›</span>
    </div>
    <div class="setrow" onclick="exportJSON()">
      <div>完整備份 (JSON)<small>包括分類、預算設定</small></div><span>›</span>
    </div>
    <div class="setrow" onclick="document.getElementById('jsonFile').click()">
      <div>還原備份 (JSON)</div><span>›</span>
    </div>
    <input type="file" id="csvFile" accept=".csv" hidden onchange="importCSV(this)">
    <input type="file" id="jsonFile" accept=".json" hidden onchange="importJSON(this)">
  </div>

  <h3 class="sec">危險區</h3>
  <button class="btn danger" onclick="clearAll()">清除所有數據</button>
  <p style="text-align:center;color:var(--muted);font-size:12px;margin-top:18px">
    數據只儲存喺你部機 (localStorage)<br>建議定期匯出 CSV 備份 · <span class="num" id="txCount"></span>
  </p>
</div>

<nav>
  <button class="on" data-pg="add" onclick="go('add',this)"><span class="i">✎</span>記帳</button>
  <button data-pg="list" onclick="go('list',this)"><span class="i">☰</span>明細</button>
  <button data-pg="stats" onclick="go('stats',this)"><span class="i">◔</span>統計</button>
  <button data-pg="budget" onclick="go('budget',this)"><span class="i">▤</span>預算</button>
  <button data-pg="more" onclick="go('more',this)"><span class="i">⋯</span>更多</button>
</nav>

<!-- 編輯彈窗 -->
<div class="sheetmask" id="editMask" onclick="if(event.target===this)closeEdit()">
  <div class="sheet">
    <h2>編輯記錄</h2>
    <div class="typetog">
      <button id="etg-out" onclick="editType='out';refreshEditTog();fillEditChips()">支出</button>
      <button id="etg-in" onclick="editType='in';refreshEditTog();fillEditChips()">收入</button>
    </div>
    <div class="fieldrow"><input type="number" id="eAmt" inputmode="decimal" step="0.01" placeholder="金額"></div>
    <div class="chips" id="eChips"></div>
    <div class="fieldrow"><input type="date" id="eDate"></div>
    <div class="fieldrow"><input type="text" id="eNote" placeholder="備註" maxlength="60"></div>
    <div class="photoprev" id="ePhotoPrev"><img id="ePhotoImg" onclick="viewPhoto()"><button class="rm" onclick="removeEditPhoto()">✕</button></div>
    <button class="btn ghost photobtn" onclick="$('eCamInput').click()">📷 影/換收據</button>
    <input type="file" id="eCamInput" accept="image/*" hidden onchange="pickEditPhoto(this)">
    <button class="btn" onclick="saveEdit()">更新</button>
    <button class="btn danger" onclick="deleteTx()">刪除呢筆</button>
  </div>
</div>

<!-- 預算彈窗 -->
<div class="sheetmask" id="budgetMask" onclick="if(event.target===this)closeBudgetSheet()">
  <div class="sheet">
    <h2>每月預算</h2>
    <div id="budgetInputs" style="max-height:55vh;overflow-y:auto"></div>
    <button class="btn" onclick="saveBudgets()">儲存</button>
  </div>
</div>

<!-- 批量匯入確認彈窗 -->
<div class="sheetmask" id="batchMask" onclick="if(event.target===this)closeBatch()">
  <div class="sheet">
    <h2>確認匯入 (<span id="batchCount">0</span> 筆)</h2>
    <div id="batchList" style="max-height:55vh; overflow-y:auto"></div>
    <button class="btn" onclick="confirmBatch()">全部加入</button>
    <button class="btn ghost" onclick="closeBatch()">取消</button>
  </div>
</div>

<div class="imgviewer" id="imgViewer" onclick="this.classList.remove('show')"><img id="viewerImg"></div>

<div class="toast" id="toast"></div>

<script>
/* ================= 數據層 ================= */
const KEY='ledger-v1';
const DEFAULT_CATS={
  out:[["🍚","飲食"],["🛒","買餸"],["🚇","交通"],["⛽","入油"],["🏠","住屋"],["📱","電話網絡"],["💊","健康"],["🐈","貓"],["🐟","魚缸"],["🎬","娛樂"],["👕","衫褲"],["📚","進修"],["🎁","禮物"],["🔧","雜項"]],
  in:[["🛵","Uber Eats"],["▶️","YouTube"],["📈","投資"],["💰","其他收入"]]
};
let S=load();
function load(){
  try{
    const d=JSON.parse(localStorage.getItem(KEY));
    if(d&&Array.isArray(d.tx))return d;
  }catch(e){}
  return {tx:[],cats:JSON.parse(JSON.stringify(DEFAULT_CATS)),budgets:{}};
}
function save(){localStorage.setItem(KEY,JSON.stringify(S))}
function uid(){return Date.now().toString(36)+Math.random().toString(36).slice(2,7)}
function fmt(n){return '$'+Number(n).toLocaleString('en',{minimumFractionDigits:0,maximumFractionDigits:2})}

/* ================= 收據相 (IndexedDB) ================= */
let _db=null;
function idb(){return new Promise((res,rej)=>{
  if(_db)return res(_db);
  const r=indexedDB.open('ledger-img',1);
  r.onupgradeneeded=()=>r.result.createObjectStore('img');
  r.onsuccess=()=>{_db=r.result;res(_db)};
  r.onerror=()=>rej(r.error);
})}
function imgPut(id,blob){return idb().then(d=>new Promise((res,rej)=>{
  const t=d.transaction('img','readwrite'); t.objectStore('img').put(blob,id);
  t.oncomplete=res; t.onerror=()=>rej(t.error);
}))}
function imgGet(id){return idb().then(d=>new Promise((res,rej)=>{
  const q=d.transaction('img').objectStore('img').get(id);
  q.onsuccess=()=>res(q.result||null); q.onerror=()=>rej(q.error);
}))}
function imgDel(id){return idb().then(d=>new Promise(res=>{
  const t=d.transaction('img','readwrite'); t.objectStore('img').delete(id);
  t.oncomplete=res; t.onerror=res;
}))}
function imgClear(){return idb().then(d=>new Promise(res=>{
  const t=d.transaction('img','readwrite'); t.objectStore('img').clear();
  t.oncomplete=res; t.onerror=res;
}))}
function loadScript(src){return new Promise((res,rej)=>{
  const s=document.createElement('script'); s.src=src; s.onload=res; s.onerror=rej;
  document.head.appendChild(s);
})}
async function decodeImage(file){
  try{ return await createImageBitmap(file) }catch(e){}
  // HEIC/HEIF (iPhone 原格式) 轉 JPEG
  if(/hei[cf]/i.test(file.type)||/\.hei[cf]$/i.test(file.name||'')){
    if(!navigator.onLine)throw new Error('heic-offline');
    if(!window.heic2any)await loadScript('https://cdn.jsdelivr.net/npm/heic2any@0.0.4/dist/heic2any.min.js');
    let jpg=await heic2any({blob:file,toType:'image/jpeg',quality:0.85});
    if(Array.isArray(jpg))jpg=jpg[0];
    return await createImageBitmap(jpg);
  }
  return await new Promise((res,rej)=>{
    const img=new Image();
    img.onload=()=>res(img);
    img.onerror=()=>rej(new Error('decode'));
    img.src=URL.createObjectURL(file);
  });
}
function compressImage(file){return decodeImage(file).then(img=>new Promise((res,rej)=>{
  const MAX=1200;
  let w=img.width,h=img.height;
  if(!w||!h)return rej(new Error('empty'));
  if(Math.max(w,h)>MAX){const k=MAX/Math.max(w,h);w=Math.round(w*k);h=Math.round(h*k)}
  const c=document.createElement('canvas'); c.width=w; c.height=h;
  c.getContext('2d').drawImage(img,0,0,w,h);
  if(img.close)img.close();
  if(img.src)URL.revokeObjectURL(img.src);
  c.toBlob(b=>b?res(b):rej(new Error('encode')),'image/jpeg',0.72);
}))}
/* OCR: Tesseract.js (免費, CDN, 需要網絡) */
function loadOCR(){return new Promise((res,rej)=>{
  if(window.Tesseract)return res();
  const s=document.createElement('script');
  s.src='https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js';
  s.onload=res; s.onerror=rej;
  document.head.appendChild(s);
})}
async function ocrAmount(blob){
  await loadOCR();
  const {data}=await Tesseract.recognize(blob,'eng');
  const text=data.text||'';
  // 優先搵 total/合計/總計 行嘅數字, 否則取最大有小數位嘅數
  const lines=text.split('\n');
  let cand=[];
  const numRe=/\d{1,6}(?:[.,]\d{2})/g;
  for(const l of lines){
    const nums=(l.match(numRe)||[]).map(s=>parseFloat(s.replace(',','.')));
    if(/total|合計|總計|amount|應付|實付/i.test(l)&&nums.length)return Math.max(...nums);
    cand.push(...nums);
  }
  if(!cand.length){
    const ints=(text.match(/\d{2,6}/g)||[]).map(Number).filter(n=>n>1&&n<100000);
    cand=ints;
  }
  return cand.length?Math.max(...cand):null;
}

async function ocrBankLines(blob){
  await loadOCR();
  const {data}=await Tesseract.recognize(blob,'eng');
  const text=data.text||'';
  const lines=text.split('\n').map(l=>l.trim()).filter(Boolean);
  const amtRe=/-?\d{1,6}\.\d{2}/;
  const dateRe=/(\d{1,2})\s?([A-Z]{3})\s?(\d{2,4})/i;
  const monthMap={JAN:1,FEB:2,MAR:3,APR:4,MAY:5,JUN:6,JUL:7,AUG:8,SEP:9,OCT:10,NOV:11,DEC:12};
  const results=[];
  let pendingMerchant=null;
  for(let i=0;i<lines.length;i++){
    const l=lines[i];
    const amtM=l.match(amtRe);
    if(!amtM){
      // 冇金額嘅行,可能係下一行嘅商戶名
      if(!dateRe.test(l)&&!/cashback|enjoy/i.test(l))pendingMerchant=l;
      continue;
    }
    const amt=parseFloat(amtM[0]);
    if(/cashback|enjoy/i.test(l))continue; // 跳過 cashback 行
    const before=l.slice(0,amtM.index).trim();
    const merchant=before||pendingMerchant||'未知商戶';
    // 揾下一行嘅日期
    let dateStr=todayStr();
    const dM=(lines[i+1]||'').match(dateRe);
    if(dM){
      const mo=monthMap[dM[2].toUpperCase()];
      let yr=dM[3].length===2?('20'+dM[3]):dM[3];
      if(mo)dateStr=yr+'-'+pad(mo)+'-'+pad(parseInt(dM[1]));
    }
    results.push({merchant,amt:Math.abs(amt),type:amt<0?'out':'in',date:dateStr});
    pendingMerchant=null;
  }
  return results;
}

const PALETTE=['#C9A961','#7FB98B','#E07856','#6FA8B8','#B084C4','#D4A5A5','#8FBC6F','#C4884F','#7B8FC4','#A3A380','#C46F8E','#6FC4B0'];

  const rows=Object.entries(by).sort((a,b)=>b[1]-a[1]);
  $('dcK').textContent=(statType==='out'?'本月支出':'本月收入');
  $('dcV').textContent=fmt(total);

  const lg=$('legend'); lg.innerHTML='';
  if(!rows.length)lg.innerHTML='<div class="empty" style="padding:16px 0">未有數據</div>';
  rows.forEach(([cat,sum],i)=>{
    const li=document.createElement('div'); li.className='li';
    li.innerHTML=`<span class="dot" style="background:${PALETTE[i%PALETTE.length]}"></span>
      <span class="name">${cat}</span>
      <span class="pct num">${(sum/total*100).toFixed(1)}%</span>
      <span class="sum num">${fmt(sum)}</span>`;
    lg.appendChild(li);
  });
  drawTrend();
}
function drawDonut(rows,total){
  const c=$('donut'), dpr=window.devicePixelRatio||1;
  const size=240; c.width=size*dpr; c.height=size*dpr;
  c.style.width=c.style.height=size+'px';
  const x=c.getContext('2d'); x.scale(dpr,dpr);
  x.clearRect(0,0,size,size);
  const cx=size/2, cy=size/2, r=96, w=26;
  if(!total){
    x.beginPath(); x.arc(cx,cy,r,0,Math.PI*2);
    x.strokeStyle='#1C2E24'; x.lineWidth=w; x.stroke(); return;
  }
  let ang=-Math.PI/2;
  rows.forEach(([_,sum],i)=>{
    const a2=ang+sum/total*Math.PI*2;
    x.beginPath(); x.arc(cx,cy,r,ang+0.015,a2-0.015);
    x.strokeStyle=PALETTE[i%PALETTE.length]; x.lineWidth=w; x.lineCap='butt'; x.stroke();
    ang=a2;
  });
}
function drawTrend(){
  const c=$('trend'), dpr=window.devicePixelRatio||1;
  const W=c.parentElement.clientWidth-32, H=150;
  c.width=W*dpr; c.height=H*dpr; c.style.width=W+'px'; c.style.height=H+'px';
  const x=c.getContext('2d'); x.scale(dpr,dpr);
  x.clearRect(0,0,W,H);
  const months=[];
  const d=new Date(view);
  for(let i=5;i>=0;i--){
    const m=new Date(d.getFullYear(),d.getMonth()-i,1);
    months.push(m.getFullYear()+'-'+pad(m.getMonth()+1));
  }
  const outs=months.map(ym=>S.tx.filter(t=>t.type==='out'&&ymOf(t.date)===ym).reduce((s,t)=>s+t.amt,0));
  const ins=months.map(ym=>S.tx.filter(t=>t.type==='in'&&ymOf(t.date)===ym).reduce((s,t)=>s+t.amt,0));
  const max=Math.max(...outs,...ins,1);
  const bw=Math.min(16,(W/6)*0.22), gap=W/6;
  x.font='11px -apple-system,sans-serif'; x.textAlign='center';
  months.forEach((ym,i)=>{
    const cx0=gap*i+gap/2;
    const ho=outs[i]/max*(H-36), hi=ins[i]/max*(H-36);
    x.fillStyle='#7FB98B'; x.fillRect(cx0-bw-2,H-24-hi,bw,hi);
    x.fillStyle='#E07856'; x.fillRect(cx0+2,H-24-ho,bw,ho);
    x.fillStyle=ym===viewYM()?'#C9A961':'#8FA396';
    x.fillText(ym.slice(5)+'月',cx0,H-8);
  });
}

  });
  const totalB=Number(S.budgets._total)||0;
  const tb=$('budgetTotal');
  if(totalB>0){
    const p=Math.min(spentTotal/totalB*100,100);

    tb.innerHTML=`<div class="budgetitem" style="margin:0">

      </div>
      <select data-f="cat" data-i="${i}">${catOpts}</select>
      <div class="skip"><input type="checkbox" data-f="skip" data-i="${i}" id="skip${i}"><label for="skip${i}">跳過呢筆 (${it.type==='out'?'支出':'收入'} · ${it.date})</label></div>
    `;
    box.appendChild(row);
  });
  box.querySelectorAll('[data-f]').forEach(el=>{
    el.addEventListener('input',e=>{
      const i=+e.target.dataset.i, f=e.target.dataset.f;
      if(f==='skip')batchItems[i].skip=e.target.checked;
      else if(f==='amt')batchItems[i].amt=parseFloat(e.target.value)||0;
      else batchItems[i][f]=e.target.value;
    });
  });
}
function confirmBatch(){
  let n=0;
  batchItems.forEach(it=>{
    if(it.skip||!it.amt||it.amt<=0)return;
    S.tx.push({id:uid(),type:it.type,cat:it.cat||S.cats[it.type][0][1],amt:it.amt,date:it.date,note:it.merchant});
    n++;
  });
  save(); closeBatch(); renderList(); renderMore();
  toast('已匯入 '+n+' 筆 ✓');
}
function closeBatch(){$('batchMask').classList.remove('show'); batchItems=[]}

function dl(name,content,mime){
  const a=document.createElement('a');
  a.href=URL.createObjectURL(new Blob([content],{type:mime}));
  a.download=name; a.click();
  setTimeout(()=>URL.revokeObjectURL(a.href),3000);
}
function exportCSV(){
  const rows=[['日期','類型','分類','金額','備註']];
  [...S.tx].sort((a,b)=>a.date.localeCompare(b.date)).forEach(t=>{
    rows.push([t.date, t.type==='out'?'支出':'收入', t.cat, t.amt, (t.note||'').replace(/"/g,'""')]);
  });
  const csv='\uFEFF'+rows.map(r=>r.map(c=>`"${c}"`).join(',')).join('\n');
  dl('ledger_'+todayStr()+'.csv',csv,'text/csv;charset=utf-8');
  toast('已匯出 CSV');
}
function importCSV(input){
  const f=input.files[0]; if(!f)return;
  const rd=new FileReader();
  rd.onload=()=>{
    try{
      const lines=rd.result.replace(/^\uFEFF/,'').split(/\r?\n/).filter(l=>l.trim());
      let n=0;
      lines.slice(1).forEach(line=>{
        const cols=parseCSVLine(line);
        if(cols.length<4)return;
        const [date,type,cat,amt,note]=cols;
        const a=parseFloat(amt);
        if(!/^\d{4}-\d{2}-\d{2}/.test(date)||!a)return;
        S.tx.push({id:uid(),type:(type==='收入'||type==='in')?'in':'out',cat:cat||'雜項',amt:a,date:date.slice(0,10),note:note||''});
        n++;
      });
      save(); toast('已匯入 '+n+' 筆'); renderList();
    }catch(e){toast('匯入失敗，檢查格式')}
    input.value='';
  };
  rd.readAsText(f,'utf-8');
}
function parseCSVLine(line){
  const out=[]; let cur='', inQ=false;
  for(let i=0;i<line.length;i++){
    const ch=line[i];
    if(inQ){
      if(ch==='"'){ if(line[i+1]==='"'){cur+='"';i++} else inQ=false }
      else cur+=ch;
    }else{
      if(ch==='"')inQ=true;
      else if(ch===','){out.push(cur);cur=''}
      else cur+=ch;
    }
  }
  out.push(cur); return out;
}
function exportJSON(){
  dl('ledger_backup_'+todayStr()+'.json',JSON.stringify(S,null,1),'application/json');
  toast('已匯出備份');
}
function importJSON(input){
  const f=input.files[0]; if(!f)return;
  const rd=new FileReader();
  rd.onload=()=>{
    try{
      const d=JSON.parse(rd.result);
      if(!Array.isArray(d.tx))throw 0;
      if(!confirm('會覆蓋現有數據，確定還原?'))return;
      S=d; save(); toast('已還原 ✓'); renderList(); renderMore(); fillChips();
    }catch(e){toast('檔案格式唔啱')}
    input.value='';
  };
  rd.readAsText(f,'utf-8');
}
function clearAll(){
  if(!confirm('清除所有記錄、分類、預算？此動作無法復原！'))return;
  if(!confirm('真係確定？建議先匯出備份。'))return;
  localStorage.removeItem(KEY);
  imgClear();
  S=load(); save();
  renderList(); renderMore(); fillChips(); toast('已清除');
}

  const d=new Date();
  $('todayLabel').textContent=d.getFullYear()+'.'+pad(d.getMonth()+1)+'.'+pad(d.getDate());
  fillChips();
  renderList();

    icons:[{src:'data:image/svg+xml,'+encodeURIComponent('<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100"><rect width="100" height="100" rx="22" fill="#0E1A15"/><text x="50" y="66" font-size="46" text-anchor="middle" fill="#C9A961" font-family="sans-serif" font-weight="bold">帳</text></svg>'),sizes:'any',type:'image/svg+xml'}]
  };
  $('manifest').href='data:application/manifest+json,'+encodeURIComponent(JSON.stringify(man));
  if('serviceWorker' in navigator)navigator.serviceWorker.register('./sw.js').catch(()=>{});
  window.addEventListener('resize',()=>{ if($('pg-stats').classList.contains('active'))drawTrend() });
})();
</script>
